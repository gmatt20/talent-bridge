[project]
name = "talent-bridge-backend"
version = "0.1.0"
description = "Talent Bridge backend API"
authors = [
    { name = "Matthew Garcia", email = "gmatt.devs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pyink>=24.10",
    "pylint>=3.3",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyink]
# Google style: 80 columns, 4-space indentation.
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
target-version = ["py312"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 80
indent-string = "    "

[tool.pylint.basic]
# Allow the short names python-style permits (iterators, exceptions, files).
good-names = ["i", "j", "k", "v", "e", "f", "_"]
# As in Google's pylintrc: tests and private helpers don't need docstrings.
no-docstring-rgx = "^(_|test)"

[tool.pylint.similarities]
# Short shared SQL fragments (a JOIN and WHERE) aren't worth abstracting.
min-similarity-lines = 8

[tool.pylint."messages control"]
# Pydantic models and small data holders legitimately have no methods.
disable = ["too-few-public-methods"]
