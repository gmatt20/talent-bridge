[project]
name = "talent-bridge-backend"
version = "0.1.0"
description = "Talent Bridge backend API"
authors = [
    { name = "Matthew Garcia", email = "gmatt.devs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
